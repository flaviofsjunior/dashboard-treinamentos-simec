<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMEC | Painel de gestão</title>
<style>
:root{--navy:#151e75;--ink:#17233c;--muted:#64748b;--line:#dfe5ed;--bg:#f3f5f9;--green:#119879;--red:#d05263;--amber:#df9a29;--blue:#487de0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 'Segoe UI',Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}a{color:inherit}button,input,select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 13px}button:hover{background:#eef1fa;border-color:#9ba9d6}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #6196ed;outline-offset:3px}.top{min-height:88px;background:white;border-bottom:1px solid var(--line);padding:17px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{width:242px;height:auto;display:block}.toplinks{display:flex;gap:7px;flex-wrap:wrap}.toplinks button{border:0;background:transparent;font-weight:600;color:var(--muted)}.toplinks button.selected{background:#eceefa;color:var(--navy)}.preview{background:#edf0f8;color:#536384;border-radius:5px;padding:5px 9px;font-size:12px;letter-spacing:.06em;white-space:nowrap}.wrap{max-width:1680px;padding:28px 32px;margin:auto}h1{font-size:29px;line-height:1.2;letter-spacing:-.6px;margin:6px 0 10px}h2{font-size:18px;margin:0 0 5px}p{margin:0}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.muted{color:var(--muted)}.small{font-size:13px}.heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:14px}.primary{background:var(--navy);color:white;border-color:var(--navy)}.primary:hover{background:#263296;color:#fff}.portal{max-width:1240px;padding-top:48px}.portal h1{font-size:36px}.portalintro{margin-bottom:32px}.accessgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.access{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.accesshead{padding:29px 29px 25px;background:var(--navy);color:#fff}.access:nth-child(2) .accesshead{background:#23364f}.accesshead h2{font-size:27px;margin:16px 0 7px}.accesshead p{font-size:15px;color:#dce3fb;max-width:450px}.iconbox{width:43px;height:43px;border:1px solid #ffffff55;border-radius:9px;display:grid;place-items:center}.iconbox svg{width:24px;height:24px}.accessbody{padding:26px 29px;flex:1}.ministats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}.ministats strong{display:block;font-size:25px;letter-spacing:-.5px}.ministats span{font-size:13px;color:var(--muted)}.accesslist{display:flex;gap:8px;flex-wrap:wrap;min-height:74px}.accesslist span{font-size:13px;background:#f2f4f8;padding:5px 9px;border-radius:5px;align-self:start}.accessfoot{padding:0 29px 26px}.accessfoot button{width:100%;padding:13px;font-weight:600;text-align:left;display:flex;justify-content:space-between}.updateflow{margin:26px 0 0;padding:20px 24px;border:1px solid var(--line);background:white;border-radius:12px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}.updateflow p{font-size:14px;color:var(--muted)}.updateflow b{color:var(--ink)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}.tabs button{border:0;border-radius:0;white-space:nowrap;background:transparent;padding:13px 18px;color:var(--muted);font-size:15px}.tabs button.active{color:var(--navy);font-weight:700;border-bottom:3px solid var(--navy)}.filters{padding:16px;border:1px solid var(--line);border-radius:11px;background:white;display:grid;grid-template-columns:repeat(5,minmax(120px,1fr)) auto;gap:12px;margin-bottom:18px}.filters label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}.filters select{width:100%;min-width:0;font-size:14px;padding:9px}.filters button{align-self:end;font-size:14px}.context{display:flex;gap:14px;justify-content:space-between;align-items:center;margin:14px 0;font-size:13px;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--tone,var(--navy));border-radius:10px;padding:17px 20px}.kpi .label{color:var(--muted);font-size:14px}.kpi strong{display:block;font-size:32px;line-height:1.3;letter-spacing:-.6px;margin:7px 0}.kpi small{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}.grid.equal{grid-template-columns:1fr 1fr}.panel{border:1px solid var(--line);border-radius:11px;background:white;padding:22px;margin-bottom:20px;min-width:0}.subtitle{font-size:13px;color:var(--muted);margin-bottom:19px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:17px}.legend span:before{content:'';display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px}.gaugegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.gauge{text-align:center;min-width:0}.gauge svg{width:100%;max-width:215px;display:block;margin:auto}.gauge h3{font-size:14px;margin:0 0 4px;font-weight:600}.gauge p{font-size:12px;color:var(--muted)}.barrow{display:grid;grid-template-columns:minmax(105px,200px) 1fr 55px;align-items:center;gap:12px;margin:13px 0;font-size:13px}.barlabel{border:0;background:transparent;text-align:left;font-size:13px;padding:0;line-height:1.35}.track{height:20px;background:#f1f4f8;border-radius:4px;overflow:hidden;display:flex}.track span{height:100%}.barvalue{text-align:right;font-variant-numeric:tabular-nums}.chartscroll{overflow:auto}.monthly{height:238px;display:flex;gap:14px;align-items:stretch;min-width:480px;padding-top:10px}.month{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:30px;gap:6px}.month .column{width:min(100%,42px);display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;background:#f1f4f8}.month .column span{width:100%}.month button{padding:0;border:0;background:none;font-size:12px;color:var(--muted)}.month .value{font-size:12px;color:var(--muted)}.month button:hover{color:var(--navy);text-decoration:underline}.notice{padding:13px 16px;background:#fff6e7;border:1px solid #f0d6a8;border-radius:8px;font-size:13px;line-height:1.5;margin:0 0 19px;color:#775217}.notice.info{background:#eef3fc;border-color:#d7e2f4;color:#405677}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.toolbar input{flex:1;min-width:200px;font-size:14px}.toolbar select{font-size:14px}.tablewrap{overflow:auto;max-height:470px;border:1px solid var(--line);border-radius:7px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f2f5fa;color:#526079;font-weight:600;position:sticky;top:0;z-index:1;white-space:nowrap}tbody tr:hover{background:#f7f9fd}td button{font-size:13px;padding:0;border:0;background:transparent;color:var(--navy);font-weight:600;text-decoration:underline}.badge{font-size:12px;display:inline-block;border-radius:4px;padding:3px 7px;white-space:nowrap;background:#eef1f5;color:#556377}.badge.good{background:#e6f5ef;color:#087859}.badge.bad{background:#fbeaec;color:#b03e51}.badge.warn{background:#fff2dc;color:#966116}.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:13px}.pagination button{font-size:13px}.empty{text-align:center;color:var(--muted);padding:35px;background:#f7f9fc;border-radius:8px}.footer{color:var(--muted);font-size:12px;padding:10px 0 24px}.trainingframe{width:100%;height:calc(100vh - 91px);border:0;display:block;background:#f3f5f9}dialog{width:min(880px,94vw);border:1px solid var(--line);border-radius:13px;padding:26px;color:var(--ink);max-height:88vh;box-shadow:0 25px 100px #10204744}dialog::backdrop{background:#17233c88}.dialoghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:20px}.details{display:grid;grid-template-columns:1fr 1fr;gap:16px}.details dt{font-size:12px;color:var(--muted);margin-bottom:3px}.details dd{margin:0;font-size:14px}.detailbox{padding:12px;background:#f4f6fa;border-radius:6px}.rules{font-size:14px}.rules li{margin:9px 0}.rules h3{font-size:16px}.rules code{background:#eef1f5;padding:2px 4px;font-size:12px}.progress{height:8px;background:#edf1f7;border-radius:8px;overflow:hidden;margin:9px 0 13px}.progress div{height:100%;background:var(--green)}.no-print{}[hidden]{display:none!important}
@media(min-width:1600px){.wrap{padding-top:32px}}@media(max-width:1100px){.filters{grid-template-columns:repeat(3,minmax(120px,1fr))}.grid{grid-template-columns:1fr}.grid.equal{grid-template-columns:1fr 1fr}.wrap{padding:22px}.top{padding:16px 22px}.gauge svg{max-width:240px}}@media(max-width:720px){.top{flex-wrap:wrap;gap:12px}.logo{width:190px}.preview{margin-left:auto}.toplinks{order:3;width:100%;justify-content:space-between}.toplinks button{font-size:14px}.wrap{padding:18px}.portal{padding-top:25px}.portal h1{font-size:29px}.accessgrid,.grid.equal{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.filters{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}.kpi strong{font-size:26px}.panel{padding:16px}.context{flex-wrap:wrap}.gaugegrid{gap:0}.gauge p{font-size:12px}.gauge h3{font-size:13px}.barrow{grid-template-columns:115px 1fr 43px;gap:8px}.accesslist{min-height:0;margin-bottom:5px}.trainingframe{height:calc(100vh - 140px)}.details{grid-template-columns:1fr}.updateflow{gap:10px}.ministats strong{font-size:22px}}@media print{.top,.tabs,.filters,.actions,.toolbar,.no-print,.pagination{display:none!important}.wrap{padding:0}.panel,.kpi{break-inside:avoid}.grid{display:block}.tablewrap{max-height:none}body{background:#fff}.footer{font-size:10px}}
</style></head><body>
<header class="top"><img id="logo" class="logo" alt="Grupo SIMEC — Construindo o futuro"><nav class="toplinks" aria-label="Painéis"><button data-view="home">Início</button><button data-view="maintenance">Manutenção</button><button data-view="training">Treinamentos</button></nav><span class="preview">PAINEL SIMEC</span></header>
<main id="app"></main><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Fechar detalhes">Fechar</button></div><div id="modalBody"></div></dialog>
<script>
'use strict';
let DATA;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=x=>Number(x).toLocaleString('pt-BR'),pct=x=>x==null?'—':(100*x).toLocaleString('pt-BR',{maximumFractionDigits:1,minimumFractionDigits:1})+'%',dt=x=>/^\d{4}-\d{2}-\d{2}/.test(String(x))?String(x).slice(0,10).split('-').reverse().join('/'):String(x||'Não informada');
const MONTHS=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const COLORS=['#119879','#d05263','#df9a29','#487de0','#8565ba','#78939e'];
const TABS={periodic:'Periódicas',nonperiodic:'Ordens Não Periódicas',backlog:'Consecução de Backlog'};
const state={view:'home',tab:'periodic',filters:{},search:'',status:'',page:0};let trainingLoaded=false;
const icon=(kind)=>kind==='tools'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m14 6 4 4M5 19l8-8M16 3a5 5 0 0 0-6 6l-7 7a3 3 0 0 0 4 4l7-7a5 5 0 0 0 7-6l-4 3-3-3z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m2 8 10-5 10 5-10 5-10-5Zm4 3v6c4 3 8 3 12 0v-6m4-3v9"/></svg>';
const sum=(rs,k)=>rs.reduce((s,r)=>s+(Number(r[k])||0),0),distinct=(rs)=>new Set(rs.map(r=>r.id).filter(v=>v!==''&&v!=null)).size;
function metrics(rs,kind=state.tab){const total=kind==='nonperiodic'?distinct(rs):rs.length,e=kind==='nonperiodic'?distinct(rs.filter(r=>r.status==='Executada')):rs.filter(r=>r.status==='Executada').length,c=distinct(rs.filter(r=>r.status==='Não Executada')),p=kind==='nonperiodic'?distinct(rs.filter(r=>r.status==='Pendente')):rs.filter(r=>r.status==='Pendente').length;return {total,e,c,p,ep:total?e/total:null,cp:total?c/total:null,pp:total?(kind==='periodic'?1-e/total-c/total:p/total):null}}
const uniq=(rs,k)=>[...new Set(rs.map(r=>r[k]).filter(v=>v!==''&&v!=null))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR',{numeric:true}));
function sourceRows(){return state.tab==='periodic'?DATA.periodic:state.tab==='nonperiodic'?DATA.nonperiodic:DATA.unified}
function filtered(rs=sourceRows()){return rs.filter(r=>Object.entries(state.filters).every(([k,v])=>!v||String(r[k])===v))}
function kpi(label,value,note,color){return `<div class="kpi" style="--tone:${color||'var(--navy)'}"><span class="label">${label}</span><strong>${value}</strong><small>${note}</small></div>`}
function panel(title,sub,body){return `<section class="panel"><h2>${title}</h2><p class="subtitle">${sub}</p>${body}</section>`}
function badge(s){return `<span class="badge ${s==='Executada'?'good':s==='Não Executada'?'bad':s==='Pendente'?'warn':''}">${esc(s||'Não informado')}</span>`}
function legend(labels=['Executadas','Não executadas / canceladas','Pendentes'],colors=COLORS){return `<div class="legend">${labels.map((l,i)=>`<span style="--c:${colors[i%colors.length]}">${esc(l)}</span>`).join('')}</div>`}
function gauge(title,value,target,color){const v=Math.max(0,Math.min(1,value||0)),angle=Math.PI*(1-target),x=100+75*Math.cos(angle),y=91-75*Math.sin(angle);return `<div class="gauge"><h3>${title}</h3><svg viewBox="0 0 200 118" role="img" aria-label="${title}: ${pct(value)}; referência ${pct(target)}"><path d="M25 91 A75 75 0 0 1 175 91" fill="none" stroke="#edf1f7" stroke-width="15" pathLength="100"/><path d="M25 91 A75 75 0 0 1 175 91" fill="none" stroke="${color}" stroke-width="15" pathLength="100" stroke-dasharray="${v*100} 100"/><circle cx="${x}" cy="${y}" r="4" fill="#17233c"/><text x="100" y="81" text-anchor="middle" font-size="26" font-weight="700" fill="#17233c">${pct(value)}</text><text x="100" y="104" text-anchor="middle" font-size="11" fill="#64748b">Referência: ${pct(target)}</text></svg></div>`}
function monthly(rs,kind=state.tab){const ms=MONTHS.filter(m=>rs.some(r=>r.month===m)),all=metrics(rs,kind);if(!ms.length)return '<div class="empty">Nenhum dado para os filtros selecionados.</div>';return legend()+`<div class="chartscroll"><div class="monthly">${ms.map(m=>{let g=metrics(rs.filter(r=>r.month===m),kind),den=kind==='nonperiodic'?all.total:g.total,values=[g.e,g.c,kind==='periodic'?g.total-g.e-g.c:g.p];return `<div class="month"><span class="value">${pct(den?g.e/den:null)}</span><div class="column" style="height:${den?180*values.reduce((a,b)=>a+b,0)/den:0}px">${values.map((v,i)=>`<span style="height:${g.total?v/values.reduce((a,b)=>a+b,0)*100:0}%;background:${COLORS[i]}" title="${esc(m)}: ${nf(v)} (${pct(den?v/den:0)})"></span>`).join('')}</div><button data-filter-key="month" data-filter-value="${m}" title="Filtrar ${m}">${m.slice(0,3)}</button></div>`}).join('')}</div></div>`}
function groupBars(rs,key,{kind=state.tab,click=true}={}){let groups=uniq(rs,key).map(k=>({key:k,m:metrics(rs.filter(r=>r[key]===k),kind)})).sort((a,b)=>b.m.total-a.m.total),max=Math.max(1,...groups.map(g=>g.m.total));return legend()+groups.map(g=>`<div class="barrow"><button class="barlabel" ${click?`data-filter-key="${key}" data-filter-value="${esc(g.key)}"`:''}>${esc(g.key)}</button><div class="track">${[g.m.e,g.m.c,g.m.p].map((v,i)=>`<span style="width:${v/max*100}%;background:${COLORS[i]}" title="${nf(v)}"></span>`).join('')}</div><span class="barvalue">${nf(g.m.total)}</span></div>`).join('')+(groups.length?'':'<div class="empty">Nenhum registro encontrado.</div>')}
function simpleBars(rs,key){let groups=uniq(rs,key).map(k=>[k,rs.filter(r=>r[key]===k).length]).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...groups.map(g=>g[1]));return groups.map(([k,n],i)=>`<div class="barrow"><button class="barlabel" data-filter-key="${key}" data-filter-value="${esc(k)}">${esc(k)}</button><div class="track"><span style="width:${n/max*100}%;background:${COLORS[i%COLORS.length]}"></span></div><span class="barvalue">${nf(n)}</span></div>`).join('')||'<div class="empty">Nenhum registro encontrado.</div>'}
function showModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal()}
function home(){let m=metrics(DATA.periodic,'periodic'),n=metrics(DATA.nonperiodic,'nonperiodic');return `<div class="wrap portal"><div class="portalintro"><p class="eyebrow">PCM · Grupo SIMEC</p><h1>Painel de gestão</h1><p class="muted">Manutenção e treinamentos em um só lugar.</p></div><div class="accessgrid"><section class="access"><div class="accesshead"><div class="iconbox">${icon('tools')}</div><h2>Manutenção</h2><p>Execução dos planos, ordens de serviço e acompanhamento do backlog.</p></div><div class="accessbody"><div class="ministats"><div><strong>${nf(m.total)}</strong><span>Ordens periódicas</span></div><div><strong>${pct(m.ep)}</strong><span>Consecução periódica</span></div><div><strong>${nf(n.total)}</strong><span>Não periódicas</span></div></div><div class="accesslist">${Object.values(TABS).map(v=>`<span>${v}</span>`).join('')}</div></div><div class="accessfoot"><button class="primary" data-view="maintenance">Acessar manutenção <span>→</span></button></div></section><section class="access"><div class="accesshead"><div class="iconbox">${icon('school')}</div><h2>Treinamentos</h2><p>Capacitação por área, acompanhamento dos colaboradores e controle de validade.</p></div><div class="accessbody"><div class="ministats"><div><strong>${nf(DATA.training.people)}</strong><span>Colaboradores</span></div><div><strong>${nf(DATA.training.records)}</strong><span>Registros válidos</span></div><div><strong>${nf(DATA.training.statuses['Concluído']||0)}</strong><span>Concluídos</span></div></div><div class="accesslist"><span>Visão geral</span><span>Áreas</span><span>Colaboradores</span><span>Treinamentos</span><span>Validade</span><span>Cadastros</span></div></div><div class="accessfoot"><button class="primary" data-view="training">Acessar treinamentos <span>→</span></button></div></section></div><div class="updateflow"><div><b>Mesma rotina de atualização</b><p>Salvar as planilhas → executar ATUALIZAR_DASHBOARD → consultar o painel.</p></div><p>Dados de manutenção atualizados em ${dt(DATA.generated)}.<br>Treinamentos e manutenção têm atualizadores independentes.</p></div><div class="footer">Fontes: planilhas de manutenção e cadastro de treinamentos da SIMEC.</div></div>`}
function filtersHtml(){let rs=sourceRows(),fields=state.tab==='nonperiodic'?[['month','Mês'],['plan','Especialidade'],['critical','Tipo de manutenção']]:state.tab==='backlog'?[['month','Mês'],['plan','Plano / especialidade'],['critical','Tipo de manutenção'],['frequency','Periodicidade']]:[['month','Mês'],['plan','Descrição do plano'],['planType','Tipo de plano'],['frequency','Periodicidade'],['tolerance','Tolerância']];return `<div class="filters">${fields.map(([k,label])=>{let values=k==='team'?uniq(DATA.control,'team'):uniq(rs,k);if(k==='month')values=MONTHS.filter(m=>values.includes(m));return `<label>${label}<select data-select="${k}"><option value="">Todos</option>${values.map(v=>`<option value="${esc(v)}" ${state.filters[k]===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}).join('')}<button id="clear">Limpar filtros</button></div>`}
function tableRows(){return filtered().filter(r=>(!state.status||r.status===state.status)&&(!state.search||Object.values(r).join(' ').toLocaleLowerCase('pt-BR').includes(state.search.toLocaleLowerCase('pt-BR'))))}
function tableHtml(){const rs=tableRows(),pages=Math.max(1,Math.ceil(rs.length/25));state.page=Math.min(state.page,pages-1);return `<section class="panel"><div class="sectionhead"><div><h2>Detalhamento das ordens</h2><p class="small muted">Selecione uma ordem para consultar seus detalhes.</p></div></div><div class="toolbar"><input id="search" aria-label="Buscar ordens" placeholder="Buscar ordem, ativo, serviço ou plano…" value="${esc(state.search)}"><select id="tableStatus" aria-label="Situação das ordens"><option value="">Todas as situações</option>${['Executada','Não Executada','Pendente'].map(s=>`<option ${state.status===s?'selected':''}>${s}</option>`).join('')}</select><button id="export" class="no-print">Exportar seleção</button></div><div class="tablewrap"><table><thead><tr><th>Ordem</th><th>Plano / especialidade</th><th>Ativo / bem</th><th>Data original</th><th>Situação</th><th>${state.tab==='periodic'?'Tolerância':'Serviço'}</th></tr></thead><tbody>${rs.slice(state.page*25,(state.page+1)*25).map(r=>`<tr><td><button data-order="${esc(r.id)}">${esc(r.id)}</button></td><td>${esc(r.plan)}</td><td>${esc(r.asset)}</td><td>${dt(r.date)}</td><td>${badge(r.status)}</td><td>${esc(state.tab==='periodic'?r.tolerance:r.service)}</td></tr>`).join('')||'<tr><td colspan="6">Nenhuma ordem encontrada para esta seleção.</td></tr>'}</tbody></table></div><div class="pagination"><span>${nf(rs.length)} registros · Página ${state.page+1} de ${pages}</span><div><button id="prevPage" ${state.page===0?'disabled':''}>Anterior</button> <button id="nextPage" ${state.page>=pages-1?'disabled':''}>Próxima</button></div></div></section>`}
function periodic(){const rs=filtered(),m=metrics(rs,'periodic'),tol=rs.filter(r=>r.tolerance!=='Não informado'&&r.tolerance!=='0'&&r.tolerance!=='#REF!');return `<div class="kpis">${kpi('Ordens planejadas',nf(m.total),'Quantidade de registros no plano')}${kpi('Executadas',nf(m.e),pct(m.ep)+' de consecução',COLORS[0])}${kpi('Não executadas / canceladas',nf(m.c),pct(m.cp)+' do planejado',COLORS[1])}${kpi('Pendentes',nf(m.p),pct(m.pp)+' pela medida do Power BI',COLORS[2])}</div><div class="grid">${panel('Consecução mensal','Percentuais calculados dentro de cada mês. Clique no mês para filtrar.',monthly(rs,'periodic'))}${panel('Indicadores e referências','Metas recuperadas das medidas do Power BI.',`<div class="gaugegrid">${gauge('Consecução',m.ep,.8,COLORS[0])}${gauge('Canceladas',m.cp,.1,COLORS[1])}${gauge('Pendentes',m.pp,.05,COLORS[2])}</div>`)}</div><div class="grid equal">${panel('Execução por plano','Ordens por descrição do plano. Clique no plano para filtrar.',groupBars(rs,'plan',{kind:'periodic'}))}${panel('Situação dos prazos','Classificação de tolerância informada na planilha.',simpleBars(tol,'tolerance')+`<p class="small muted" style="margin-top:18px">${nf(rs.length-tol.length)} registros sem tolerância válida. A origem contém ${rs.filter(r=>r.tolerance==='#REF!').length} erro(s) de referência.</p>`)}</div>${tableHtml()}`}
function nonperiodic(){const rs=filtered(),m=metrics(rs,'nonperiodic');return `<div class="kpis">${kpi('Ordens não periódicas',nf(m.total),'Contagem de ordens distintas')}${kpi('Executadas',nf(m.e),pct(m.ep)+' da seleção',COLORS[0])}${kpi('Canceladas',nf(m.c),pct(m.cp)+' da seleção',COLORS[1])}${kpi('Pendentes',nf(m.p),pct(m.pp)+' da seleção',COLORS[2])}</div><div class="grid">${panel('Execução por especialidade','Ordens distintas em cada situação.',groupBars(rs,'plan',{kind:'nonperiodic'}))}${panel('Participação mensal','Regra do Power BI: percentuais sobre o total dos meses selecionados.',monthly(rs,'nonperiodic'))}</div><div class="grid equal">${panel('Ordens por mês','Quantidade de executadas, canceladas e pendentes.',groupBars(rs,'month',{kind:'nonperiodic'}))}${panel('Tipos de manutenção','Classificação registrada na origem.',simpleBars(rs,'critical'))}</div>${tableHtml()}`}
function backlog(){const rs=filtered(),active=rs.filter(r=>['Executada','Pendente','Liberado'].includes(r.status)),pending=rs.filter(r=>r.status==='Pendente'),ages=rs.filter(r=>r.kind==='NÃO PERIÓDICA'&&r.age!==''&&r.age!=null&&Number.isFinite(Number(r.age))).map(r=>Number(r.age)),types=uniq(active,'critical'),months=MONTHS.filter(m=>active.some(r=>r.month===m)),max=Math.max(1,...months.map(m=>active.filter(r=>r.month===m).length));return `<div class="notice info">A composição abaixo segue a medida do Power BI: inclui situações Executada, Pendente e Liberado. A idade média considera todos os registros não periódicos com idade preenchida na base Unificado.</div><div class="kpis">${kpi('Ordens na base unificada',nf(rs.length),'Periódicas e não periódicas')}${kpi('Ordens na composição',nf(active.length),'Executada, Pendente e Liberado',COLORS[0])}${kpi('Pendentes na seleção',nf(pending.length),'Situação informada na origem',COLORS[2])}${kpi('Idade média não periódica',ages.length?(sum(ages.map(age=>({age})),'age')/ages.length).toLocaleString('pt-BR',{maximumFractionDigits:1})+' dias':'—','Idade armazenada na planilha',COLORS[3])}</div><div class="grid equal">${panel('Composição mensal por tipo','Participação dentro de cada mês, conforme a medida original.',legend(types)+`<div class="chartscroll"><div class="monthly">${months.map(m=>{let rr=active.filter(r=>r.month===m);return `<div class="month"><span class="value">${nf(rr.length)}</span><div class="column" style="height:180px">${types.map((t,i)=>{let n=rr.filter(r=>r.critical===t).length;return `<span style="height:${100*n/rr.length}%;background:${COLORS[i%COLORS.length]}" title="${esc(t)}: ${nf(n)} (${pct(n/rr.length)})"></span>`}).join('')}</div><button data-filter-key="month" data-filter-value="${m}">${m.slice(0,3)}</button></div>`}).join('')}</div></div>`)}${panel('Quantidade por tipo de manutenção','Mesmas situações utilizadas no gráfico de composição.',simpleBars(active,'critical'))}</div><div class="grid equal">${panel('Consecução das periódicas por plano','Situação dos registros periódicos na seleção.',groupBars(rs.filter(r=>r.kind==='PERIÓDICA'),'plan',{kind:'periodic'}))}${panel('Situação das não periódicas','Ordens não periódicas na base unificada.',groupBars(rs.filter(r=>r.kind==='NÃO PERIÓDICA'),'plan',{kind:'nonperiodic'}))}</div>${tableHtml()}`}
function maintenance(){return `<div class="wrap"><div class="heading"><div><p class="eyebrow">PCM · Gestão da manutenção</p><h1>Dashboard de manutenção</h1><p class="muted small">Planos, ordens e consecução de backlog</p></div><div class="actions"><button id="rules">Fontes e regras</button><button id="print">Imprimir</button></div></div><nav class="tabs" aria-label="Abas de manutenção">${Object.entries(TABS).map(([id,name])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}" aria-current="${state.tab===id?'page':'false'}">${name}</button>`).join('')}</nav>${filtersHtml()}<div class="context"><span>${TABS[state.tab]} · ${Object.values(state.filters).some(Boolean)?'Filtros aplicados':'Todos os períodos disponíveis'}</span><span>Dados atualizados em ${dt(DATA.generated)} · Clique nos gráficos para filtrar</span></div><div id="dashboard">${state.tab==='periodic'?periodic():state.tab==='nonperiodic'?nonperiodic():backlog()}</div><footer class="footer">Fontes: Base de dados Power bi -.xlsm e Não_Periodicas_Power_bi_corrigido.xlsm · Dados carregados das planilhas de manutenção.</footer></div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('selected',b.dataset.view===state.view));if(state.view==='training'){if(!$('trainingFrame')){$('app').innerHTML='<iframe id="trainingFrame" class="trainingframe" title="Dashboard de treinamentos SIMEC"></iframe>';$('trainingFrame').src='./treinamentos.html'}return}$('app').innerHTML=state.view==='home'?home():maintenance();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('selected',b.dataset.view===state.view))}
function rules(){showModal('Fontes e regras de cálculo',`<div class="rules"><h3>Fontes dos indicadores</h3><ul>${DATA.sources.map(s=>`<li><b>${esc(s.name)}</b><br>Arquivo modificado em ${dt(s.modified)}.</li>`).join('')}</ul><h3>Periódicas</h3><p>Planejado = número de linhas. Executadas = linhas com Status_Final “Executada”. Canceladas = ordens distintas com “Não Executada”. Consecução = executadas ÷ planejado. Pendentes (%) = 1 − consecução − canceladas (%). Referências: 80%, 10% e 5%.</p><h3>Não periódicas</h3><p>Contagem distinta de ID_Ordem. Os percentuais mensais usam o total dos meses selecionados no denominador, seguindo ALLSELECTED do Power BI.</p><h3>Consecução de Backlog</h3><p>A composição por tipo inclui Executada, Pendente e Liberado, como a medida “Qtd Executadas por Tipo”. A idade média vem da coluna “Idade (Dias)” das não periódicas na aba Unificado e não é recalculada como idade de pendências. Filtros são aplicados diretamente às ordens, por plano, mês e tipo.</p><h3>Qualidade da origem</h3><p>Espaços nas categorias são removidos e os meses são normalizados. As linhas vazias de não periódicas não entram nas contagens. O erro #REF! na tolerância permanece identificado e fica fora do gráfico de prazos. Nenhuma planilha foi alterada.</p><h3>Treinamentos e atualização</h3><p>O painel existente e suas regras de cadastro foram reutilizados. Para atualizar, salve as planilhas e execute ATUALIZAR_DASHBOARD na pasta do assunto correspondente.</p></div>`)}
function order(id){let r=filtered().find(r=>String(r.id)===id);if(!r)return;let labels={id:'Ordem',planId:'Plano',plan:'Descrição do plano / especialidade',asset:'Bem / ativo',assetName:'Nome do bem',service:'Serviço / manutenção',date:'Data original',status:'Situação',system:'Status do sistema',frequency:'Periodicidade',week:'Semana',month:'Mês',planType:'Tipo de plano',critical:'Criticidade / tipo',tolerance:'Tolerância',reason:'Justificativa',area:'Área',age:'Idade na base (dias)',kind:'Classificação',specialty:'Especialidade',user:'Usuário'};showModal('Ordem '+id,`<dl class="details">${Object.entries(r).filter(([k])=>labels[k]).map(([k,v])=>`<div class="detailbox"><dt>${labels[k]}</dt><dd>${k==='date'?dt(v):esc(v===''?'Não informado':v)}</dd></div>`).join('')}</dl>`)}
function exportCSV(){const rows=tableRows(),keys=['id','plan','asset','date','status','service','month','week','tolerance'];let cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'"+'$&').replace(/"/g,'""')+'"';let content='\ufeff'+[['Ordem','Plano / Especialidade','Ativo','Data original','Situação','Serviço','Mês','Semana','Tolerância'],...rows.map(r=>keys.map(k=>r[k]))].map(r=>r.map(cell).join(';')).join('\r\n'),url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='Manutencao_'+state.tab+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){if(!DATA)return;state.view=b.dataset.view;render();window.scrollTo(0,0)}else if(b.dataset.tab){state.tab=b.dataset.tab;state.filters={};state.search='';state.status='';state.page=0;render()}else if(b.dataset.filterKey){state.filters[b.dataset.filterKey]=b.dataset.filterValue;state.page=0;render()}else if(b.dataset.order){order(b.dataset.order)}else if(b.id==='clear'){state.filters={};state.search='';state.status='';state.page=0;render()}else if(b.id==='rules')rules();else if(b.id==='closeModal')$('modal').close();else if(b.id==='print')window.print();else if(b.id==='export')exportCSV();else if(b.id==='prevPage'){state.page--;refreshTable()}else if(b.id==='nextPage'){state.page++;refreshTable()}});
document.addEventListener('change',e=>{if(e.target.dataset.select){state.filters[e.target.dataset.select]=e.target.value;if(e.target.dataset.select==='month')delete state.filters.week;state.page=0;render()}else if(e.target.id==='tableStatus'){state.status=e.target.value;state.page=0;refreshTable()}});
function refreshTable(){const search=$('search'),section=search?.closest('section');if(section)section.outerHTML=tableHtml()}
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;state.search=e.target.value;state.page=0;refreshTable();$('search').focus();$('search').setSelectionRange(pos,pos)}});
async function initialize(){
 $('app').innerHTML='<div class="wrap"><p>Carregando os indicadores…</p></div>';
 try {
  const load=async name=>{const r=await fetch('./'+name+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Não foi possível carregar '+name);return r.json()};
  const [maintenance,training]=await Promise.all([load('dados_manutencao.json'),load('dados.json')]);
  if(!Array.isArray(maintenance.periodic)||!Array.isArray(training.records))throw Error('Dados inválidos. Tente atualizar a página.');
  DATA={...maintenance,training:{people:training.people.length,records:training.records.length,statuses:training.records.reduce((acc,r)=>(acc[r.status]=(acc[r.status]||0)+1,acc),{})}};
  $('logo').src=DATA.logo;render();
 } catch(e){$('app').innerHTML='<div class="wrap"><h1>Não foi possível carregar o painel</h1><p>'+esc(e.message)+'</p><p class="muted">Verifique sua conexão e recarregue a página.</p><button id="retryLoad">Tentar novamente</button></div>';$('retryLoad').onclick=initialize}
}
initialize();
</script></body></html>
